name: Swap v10 engine
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap main11.py onto main.py
        run: |
          git config user.name "wyze69-sys"
          git config user.email "wyze69-sys@users.noreply.github.com"
          git rm main.py
          git mv main11.py main.py
          rm .github/workflows/swap-v10.yml
          git add -A
          git commit -m "Tiny Pawns v10 engine"
          git push
