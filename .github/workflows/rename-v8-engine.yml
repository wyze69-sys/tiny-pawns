name: Rename v8 engine to main.py
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-v8-engine.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Replace main.py with v8 engine
        run: |
          set -e
          if [ ! -f main8.py ]; then
            echo "main8.py not found; nothing to do."
            exit 0
          fi
          git rm -q main_old.py || true
          git mv main8.py main.py
          git rm -q .github/workflows/rename-v8-engine.yml
          git config user.name "wyze69-sys"
          git config user.email "wyze69-sys@users.noreply.github.com"
          git commit -m "Tiny Pawns v8 engine"
          git push
